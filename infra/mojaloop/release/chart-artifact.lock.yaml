# Project-owned release manifest for the central Hub chart artifact.
# This is NOT a Helm-generated Chart.lock. Fill PENDING fields ONLY from real, executed
# commands (scripts/verify-chart-artifact.sh); never fabricate a checksum or inventory.
apiVersion: p2p-platform/release-manifest/v1
kind: MojaloopHubChartArtifact
metadata:
  name: mojaloop-hub-chart
  workstream: operator (D-08/D-09, ADR-010/011)
  status: metadata-inspected   # package NOT pulled/rendered yet (B-10)
chart:
  name: mojaloop
  version: "17.2.0"
  source:
    repository_url: https://mojaloop.io/helm/repo/
    index_entry: mojaloop-17.2.0
    git_tag: https://github.com/mojaloop/helm/tree/v17.2.0
official_release:
  tag: v17.2.0
  published: "2026-05-04"        # GitHub release page (inspected 2026-10-08)
  release_commit: aaee1fb        # GitHub-verified signature, GPG key B5690EEEBB952194
package:
  sha256: PENDING_PULL          # record ONLY from an actual helm pull + sha256sum
  prov_file: NOT_VERIFIED       # verify only if officially published with a trusted key
chart_metadata:                  # inspected from mojaloop/Chart.yaml @ tag v17.2.0
  app_version_note: >-
    Descriptive service-version list, NOT a single application release. Chart version,
    subchart versions, appVersion and image tags are separately versioned and must stay
    separate fields in any pin manifest.
  app_version: "ml-api-adapter: v16.9.2; central-ledger: v19.12.7; account-lookup-service: v17.15.2; quoting-service: v17.14.3; central-settlement: v17.3.3; bulk-api-adapter: v17.2.5; transaction-requests-service: v14.4.7; simulator: v12.3.6; mojaloop-simulator: v15.5.3; sdk-scheme-adapter: v24.19.5; auth-service: v15.2.7; als-consent-oracle: v1.1.6; thirdparty-sdk: v15.1.3; ml-testing-toolkit: v18.19.1; ml-testing-toolkit-ui: v16.7.4"
  dependencies:
    - {name: account-lookup-service, version: "17.2.0", condition: "account-lookup-service.enabled", scope: "core: discovery (ALS)"}
    - {name: als-msisdn-oracle, version: "17.2.0", condition: "als-msisdn-oracle.enabled", scope: "conditional: oracle (scheme-specific choice)"}
    - {name: quoting-service, version: "17.2.0", condition: "quoting-service.enabled", scope: "core: quotes"}
    - {name: ml-api-adapter, version: "17.2.0", condition: "ml-api-adapter.enabled", scope: "core: Hub API edge (NOT the DFSP SDK Scheme Adapter)"}
    - {name: centralledger, version: "17.2.0", condition: "centralledger.enabled", scope: "core: transfer/clearing/positions"}
    - {name: centralsettlement, version: "17.2.0", condition: "centralsettlement.enabled", scope: "conditional: settlement workflows per approved profile"}
    - {name: simulator, version: "17.2.0", condition: "simulator.enabled", scope: "test-only"}
    - {name: mojaloop-simulator, version: "17.2.0", condition: "mojaloop-simulator.enabled", scope: "test-only"}
    - {name: mojaloop-ttk-simulators, version: "17.2.0", condition: "mojaloop-ttk-simulators.enabled", scope: "test-only"}
    - {name: ml-testing-toolkit, version: "17.14.0", condition: "ml-testing-toolkit.enabled", scope: "test-only"}
    - {name: ml-testing-toolkit-cli, version: "17.2.0", aliases: "ml-ttk-* (many)", scope: "test-only hooks/tests"}
    - {name: mojaloop-bulk, version: "17.2.0", condition: "mojaloop-bulk.enabled", scope: "conditional feature (not required for P2P)"}
    - {name: transaction-requests-service, version: "17.2.0", condition: "transaction-requests-service.enabled", scope: "conditional feature"}
    - {name: thirdparty, version: "17.2.0", condition: "thirdparty.enabled", scope: "conditional: OFF by default; isolated synthetic PISP trial only"}
    - {name: inter-scheme-proxy-adapter, version: "17.2.0", condition: "inter-scheme-proxy-adapter.enabled", scope: "conditional feature"}
    - {name: connection-manager, version: "17.2.0", condition: "connection-manager.enabled", scope: "conditional feature"}
    - {name: mojaloop-iam, version: "17.2.1", condition: "iam.enabled", scope: "conditional: IAM"}
    - {name: common, version: "3.1.6", repository: "https://mojaloop.github.io/charts/repo", scope: "shared library chart"}
values:
  file: values/dev-reference.yaml
  checksum: PENDING_RENDER
verification:
  inspected:                      # fetched and read from official sources on 2026-10-08
    - "Chart.yaml @ v17.2.0 tag: dependencies + appVersion recorded above"
    - "values.yaml @ v17.2.0 tag: structure inspected (CONFIG anchors, MySQL/Kafka backends)"
    - "GitHub release page v17.2.0: publish date, release commit, verified signature"
  pending:                         # do NOT claim these until actually executed
    - "helm pull + package SHA-256"
    - "helm lint with dev-reference values"
    - "helm template render (release name + chart) and rendered-manifest checksum"
    - "rendered workload/image inventory"
    - "optional disposable install + helm test"
  tool_versions:
    helm: PENDING
    kubectl: PENDING
    kubernetes: PENDING
  render_evidence:
    rendered_manifest_sha256: PENDING
    workload_inventory: PENDING
environment:
  target: disposable dev/test ONLY — never production (B-10: no Helm/cluster in current tooling)
