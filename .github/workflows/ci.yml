name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      # The Prettier guard may commit+push formatting fixes back to the branch.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # On PRs, check out the real head branch (not the detached merge ref)
          # so the Prettier guard can commit formatting fixes back to the branch.
          ref: ${{ github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint (ESLint)
        run: |
          set -o pipefail
          if ! pnpm run lint; then
            echo "ESLint failed. First issues as annotations:"
            pnpm exec eslint . --format unix 2>/dev/null | grep -E ':[0-9]+:[0-9]+: ' | head -50 | sed -E 's#^([^:]+):([0-9]+):[0-9]+: (.*)$#::error file=\1,line=\2::ESLint \3#' || true
            exit 1
          fi
      - name: Enforce Prettier formatting (auto-commits if needed, then requires a fresh run)
        run: |
          pnpm run format
          if ! git diff --quiet; then
            git config user.name "eeeasy-ci"
            git config user.email "ci@eeeasy-pay.local"
            git add -A
            git commit -m "style: apply prettier formatting (CI guard)"
            TARGET_BRANCH="${GITHUB_HEAD_REF:-main}"
            git push origin "HEAD:${TARGET_BRANCH}"
            echo "::error title=Formatting pushed::Prettier reformatting was committed to this branch. A new CI run on the formatted commit is required and will verify it; push any new commit to trigger it."
            exit 1
          fi
      - name: Format check
        run: pnpm run format:check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Secret scan
        run: bash ci/secret-scan.sh

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eeeasy_pay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: eeeasy_pay
    steps:
      - uses: actions/checkout@v4
      - name: Prepare synthetic auth schema and roles (CI-only fixture)
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f ci/db/prepare.sql 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply migrations in order
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "applying $f"
            if ! psql -v ON_ERROR_STOP=1 -f "$f" > /tmp/migration.log 2>&1; then
              echo "::error title=Migration failed::$(basename "$f"): $(tail -c 300 /tmp/migration.log | tr '\n' ' ')"
              tail -c 2000 /tmp/migration.log >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "All migrations applied in order." >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke assertions (schema, balanced journal, outbox lease, inbox dedupe)
        run: |
          set -o pipefail
          if ! psql -v ON_ERROR_STOP=1 -f ci/db/smoke.sql > /tmp/smoke.log 2>&1; then
            echo "::error title=Smoke SQL failed::$(tail -c 400 /tmp/smoke.log | tr '\n' ' ')"
            cat /tmp/smoke.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "smoke.sql: all assertions passed" >> "$GITHUB_STEP_SUMMARY"
      - name: RLS and grant probes
        run: |
          set -euo pipefail
          # 1) anon must be DENIED on payment_intents (no grants).
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE anon; SELECT count(*) FROM public.payment_intents;" >/dev/null 2>&1; then
            echo "FAIL: anon could query public.payment_intents"; exit 1
          else
            echo "ok: anon denied on public.payment_intents"
          fi
          # 2) anon must be DENIED on app_private functions (no schema usage).
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE anon; SELECT app_private.claim_outbox('probe', 1, 5);" >/dev/null 2>&1; then
            echo "FAIL: anon could call app_private.claim_outbox"; exit 1
          else
            echo "ok: anon denied on app_private.claim_outbox"
          fi
          # 3) authenticated can read granted columns through RLS (zero rows without a jwt claim).
          if ! psql -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; SELECT count(payment_intent_id) FROM public.payment_intents;" > /tmp/probe3.log 2>&1; then
            echo "::error title=Probe 3 failed::$(tail -c 300 /tmp/probe3.log | tr '\n' ' ')"
            exit 1
          fi
          echo "ok: authenticated reads public.payment_intents through RLS"
          # 4) authenticated must be DENIED on columns not granted to it.
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; SELECT request_fingerprint FROM public.payment_intents;" >/dev/null 2>&1; then
            echo "FAIL: authenticated could read ungranted column request_fingerprint"; exit 1
          else
            echo "ok: authenticated denied on ungranted column"
          fi
          # 5) authenticated can call the split-membership predicate (returns false without a claim).
          if ! psql -v ON_ERROR_STOP=1 -t -c "SET ROLE authenticated; SELECT app_private.can_read_split_bill(NULL::uuid);" > /tmp/probe5.log 2>&1; then
            echo "::error title=Probe 5 failed::$(tail -c 300 /tmp/probe5.log | tr '\n' ' ')"
            exit 1
          fi
          echo "ok: authenticated can call app_private.can_read_split_bill"
          echo "All RLS and grant probes passed." >> "$GITHUB_STEP_SUMMARY"
